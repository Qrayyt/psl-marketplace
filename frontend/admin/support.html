<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Диалоги клиентов — PSL</title>
  <link rel="stylesheet" href="/assets/css/support.css?v=2">
  <script defer src="/assets/js/api.js?v=20261116-1"></script>
  <script defer src="/assets/js/support.js?v=2"></script>
<link rel="stylesheet" href="/assets/css/admin-polish.css?v=1.1.0">
</head>
<body data-psl-admin data-admin-preview data-support-mode="staff">
  <header class="support-header">
    <a class="brand" href="/admin/"><img src="/assets/images/psl-logo.svg" width="62" height="28" alt="PSL"></a>
    <nav aria-label="Навигация"><button type="button" class="secondary" data-team hidden>Сотрудники</button><a href="/admin/" data-staff-home>В админку ↗</a></nav>
  </header>
  <main class="support-main">
    <div class="page-top">
      <div><a class="back-link" href="/admin/dialogs/" data-queue-link hidden>← Все диалоги</a><h1>Диалоги клиентов</h1></div>
      <span class="status-chip" data-status hidden></span>
    </div>
    <p class="feedback" role="status" data-feedback>Загружаем…</p>
    <section data-queue hidden aria-label="Диалоги"></section>
    <div class="support-layout" data-room hidden>
      <aside class="case-panel" data-client hidden aria-label="Профиль клиента">
        <div data-profile></div>
        <section data-suggestions aria-label="Предложения для профиля"></section>
        <section data-notes aria-label="Заметки клиента"></section>
      </aside>
      <section class="room" aria-label="Переписка">
        <div class="room-bar" data-room-bar></div>
        <div class="transcript" data-transcript role="log" aria-label="Сообщения" tabindex="0"></div>
        <form class="compose" data-compose hidden>
          <label class="sr-only" for="support-message">Сообщение</label>
          <textarea id="support-message" name="message" rows="2" maxlength="4000" placeholder="Напишите сообщение…" required></textarea>
          <button class="primary" type="submit">Отправить</button>
        </form>
      </section>
    </div>
  </main>
  <dialog data-team-dialog aria-labelledby="team-title"><div class="dialog-head"><h2 id="team-title">Сотрудники</h2><form method="dialog"><button class="secondary">Закрыть</button></form></div><form class="team-form" data-role-form><label>Почта аккаунта<input name="email" type="email" required maxlength="254" placeholder="manager@example.com"></label><button class="primary" type="submit">Назначить менеджером</button></form><p role="status" data-team-feedback></p><div data-team-list></div></dialog>
</body>
</html>
