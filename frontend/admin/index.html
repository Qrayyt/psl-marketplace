<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSL Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" data-sidebar>
    <div class="sidebar-header">
      <h2>PSL Admin</h2>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-nav="dashboard">Дашборд</button>
      <button class="nav-item" data-nav="products">Товары</button>
      <button class="nav-item" data-nav="users">Пользователи</button>
      <button class="nav-item" data-nav="orders">Заказы</button>
      <button class="nav-item" data-nav="discounts">Скидки</button>
      <button class="nav-item" data-nav="exchange">Обмен 1С</button>
      <button class="nav-item" data-nav="audit">Аудит-лог</button>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item logout" data-logout>Выйти</button>
    </div>
  </aside>
  <main class="content" data-content>
    <div class="loading">Загрузка...</div>
  </main>
</div>

<!-- Модалка логина -->
<div class="modal-overlay" data-login-modal style="display:none">
  <div class="modal">
    <h2>Вход в админ-панель</h2>
    <form data-login-form>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Пароль" required>
      <div class="error" data-login-error></div>
      <button type="submit" class="btn primary">Войти</button>
    </form>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
