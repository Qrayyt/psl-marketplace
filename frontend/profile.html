<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PSL — профиль</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/tablet-style.css">
  <link rel="stylesheet" href="assets/css/mobile-style.css">
  <link rel="stylesheet" href="assets/css/auth-ui.css">
  <link rel="stylesheet" href="assets/css/psl.css">
  <script defer src="assets/js/experience.js"></script>
</head>
<body>
<div class="site-shell">

<header class="masthead">
  <a class="psl-brand" href="index.html" aria-label="PSL — главная"><img src="assets/images/psl-logo.webp" width="80" height="31" alt="PSL"><span>POLYMER<br>SYSTEM LABS</span></a>
  <nav aria-label="Основная навигация"><a href="index.html#brands">Бренды</a><a href="index.html#catalog">Каталог</a><a href="https://polymer-system.ru/documents" target="_blank" rel="noopener">Документация ↗</a></nav>
  <div class="header-actions"><a href="profile.html" class="account-link" data-auth-btn>Личный кабинет ↗</a><button class="menu-toggle" aria-expanded="false" aria-controls="mobile-menu" aria-label="Открыть меню"><span></span><span></span></button></div>
</header>
<nav class="mobile-menu" id="mobile-menu" aria-label="Мобильная навигация" hidden><a href="index.html#brands">Бренды</a><a href="index.html#catalog">Каталог</a><a href="https://polymer-system.ru/documents">Документация ↗</a><a href="profile.html">Личный кабинет</a></nav>

  <main class="page-main">
    <section class="section">
      <div class="container profile-layout">
        <aside class="profile-card">
          <h1 class="profile-name">Профиль</h1>
          <p class="profile-sub">Сохранённые материалы, текущий запрос и данные аккаунта.</p>
          <div class="menu-list">
            <button class="menu-btn active" type="button" data-profile-nav="cart">Корзина</button>
            <button class="menu-btn" type="button" data-profile-nav="favs">Избранное</button>
            <button class="menu-btn" type="button" data-profile-nav="account">Аккаунт</button>
          </div>
          <div class="stats-grid">
            <div class="stat"><div class="stat-num" data-stat-cart>0</div><div class="stat-label">в корзине</div></div>
            <div class="stat"><div class="stat-num" data-stat-favs>0</div><div class="stat-label">в избранном</div></div>
            <div class="stat"><div class="stat-num" style="font-size:18px" data-stat-total>0 ₽</div><div class="stat-label">сумма</div></div>
          </div>
        </aside>
        <section data-profile-content></section>
      </div>
    </section>
  </main>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth-ui.js"></script>
</body>
</html>
