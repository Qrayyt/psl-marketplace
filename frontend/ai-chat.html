<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PSL — подбор материала</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/tablet-style.css">
  <link rel="stylesheet" href="assets/css/mobile-style.css">
  <link rel="stylesheet" href="assets/css/auth-ui.css">
  <link rel="stylesheet" href="assets/css/psl.css">
  <script defer src="assets/js/experience.js"></script>
</head>
<body>
<div class="site-shell">

<header class="masthead">
  <a class="psl-brand" href="index.html" aria-label="PSL — главная"><img src="assets/images/psl-logo.webp" width="80" height="31" alt="PSL"><span>POLYMER<br>SYSTEM LABS</span></a>
  <nav aria-label="Основная навигация"><a href="index.html#brands">Бренды</a><a href="index.html#catalog">Каталог</a><a href="https://polymer-system.ru/documents" target="_blank" rel="noopener">Документация ↗</a></nav>
  <div class="header-actions"><a href="profile.html" class="account-link" data-auth-btn>Личный кабинет ↗</a><button class="menu-toggle" aria-expanded="false" aria-controls="mobile-menu" aria-label="Открыть меню"><span></span><span></span></button></div>
</header>
<nav class="mobile-menu" id="mobile-menu" aria-label="Мобильная навигация" hidden><a href="index.html#brands">Бренды</a><a href="index.html#catalog">Каталог</a><a href="https://polymer-system.ru/documents">Документация ↗</a><a href="profile.html">Личный кабинет</a></nav>

  <main class="chat-page">
    <div class="container" style="height:100%">
      <section class="chat-shell">
        <aside class="chat-sidebar">
          <h2 class="sidebar-title">PSL Подбор</h2>
          <button class="new-chat" type="button" data-new-chat>+ Новый чат</button>
          <div class="chat-history">
            <button type="button" data-chat-preset="Нужно защитное покрытие для бетона">Покрытие для бетона</button>
            <button type="button" data-chat-preset="Подбери систему для промышленного пола">Система для промышленного пола</button>
            <button type="button" data-chat-preset="Что ты умеешь?">Что ты умеешь?</button>
          </div>
        </aside>
        <div class="chat-main">
          <div class="chat-topbar">
            <button class="chat-menu-btn" type="button" data-chat-menu aria-label="Открыть чаты">
              <span></span><span></span><span></span>
            </button>
            <div class="chat-model">PSL · поиск по каталогу</div>
          </div>
          <div class="chat-messages" data-chat-messages></div>
          <form class="chat-composer" data-chat-form>
            <div class="chat-box">
              <textarea class="chat-textarea" data-chat-input placeholder="Спроси что угодно" rows="1"></textarea>
              <button class="chat-send" type="submit">↑</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth-ui.js"></script>
</body>
</html>
