<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Справочник дилера — PSL</title>
  <link rel="stylesheet" href="/assets/css/handbook.css?v=1">
  <script defer src="/assets/js/api.js?v=20261116-handbook"></script>
  <script defer src="/assets/js/handbook.js?v=1"></script>
</head>
<body data-admin-preview>
  <header class="bar">
    <a href="/" aria-label="PSL Marketplace"><img src="/assets/images/psl-logo.svg" width="62" height="28" alt="PSL"></a>
    <a href="/">Каталог PSL ↗</a>
  </header>
  <main>
    <h1>Справочник дилера</h1>
    <p id="status" role="status">Проверяем доступ…</p>
    <a id="login" class="action" hidden>Войти в аккаунт</a>
    <div id="archive" hidden>
      <p class="intro">Архив техкарт и сертификатов. Актуальность редакций проверяется.</p>
      <div class="layout">
        <nav aria-label="Разделы справочника">
          <button type="button" data-section="" aria-pressed="true">Все документы</button>
          <button type="button" data-section="technical" aria-pressed="false">Техкарты</button>
          <button type="button" data-section="certificates" aria-pressed="false">Сертификаты</button>
        </nav>
        <section aria-label="Документы">
          <label for="search">Поиск по названию</label>
          <input type="search" id="search" placeholder="Например, WIRON Isolit">
          <p class="count" id="count" role="status"></p>
          <ul id="documents"></ul>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
