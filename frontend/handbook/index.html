<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Справочник PSL</title>
  <link rel="stylesheet" href="/assets/css/handbook.css?v=7">
  <script defer src="/assets/js/handbook-articles.js?v=1"></script>
  <script defer src="/assets/js/handbook.js?v=6"></script>
  <link rel="stylesheet" href="/assets/css/site-nav.css?v=1">
  <meta name="description" content="Справочник PSL по промышленным материалам, системам FIXTILE, областям применения и сертификатам.">
  <link rel="canonical" href="https://store.polymer-system.ru/handbook/">
<link rel="stylesheet" href="/assets/css/design-system.css?v=1.1.0">
</head>
<body>
  <nav class="psl-site-nav" aria-label="Разделы PSL">
  <div class="psl-site-nav-inner">
    <a class="psl-site-nav-brand" href="/" aria-label="PSL — на главную"><img src="/assets/images/psl-logo.svg" width="56" height="24" alt="PSL"></a>
    <a href="/">Каталог</a>
    <a href="/handbook/" aria-current="page">Справочник</a>
    <a href="/ai-chat.html">Guardex</a>
    <a href="/profile.html">Профиль</a>
    <a href="/support.html">Менеджер</a>
  </div>
</nav>
  <main>
    <h1>Справочник PSL</h1>
    <p id="status" role="status">Загружаем материалы…</p>
    <button id="retry" type="button" hidden>Повторить загрузку</button>
    <div id="archive" hidden>
      <p class="intro">Системы, области применения и материалы для партнёров. Техкарты доступны в карточках <a href="/">каталога</a>.</p>
      <div class="layout">
        <nav aria-label="Разделы справочника">
          <button type="button" data-section="" aria-pressed="true">Все материалы</button>
          <button type="button" data-section="Системы решений" data-filter="systems" aria-pressed="false">Системы решений</button>
          <button type="button" data-section="Отрасли применения" data-filter="industries" aria-pressed="false">Отрасли применения</button>
          <button type="button" data-section="Работа с партнёрами" data-filter="partners" aria-pressed="false">Работа с партнёрами</button>
          <button type="button" data-section="Архив сертификатов" data-filter="certificates" aria-pressed="false">Сертификаты</button>
        </nav>
        <section aria-label="Материалы">
          <label for="search">Поиск по справочнику</label>
          <input type="search" id="search" aria-describedby="search-hint" placeholder="Например, парковки">
          <p id="search-hint" class="search-hint">По тексту статей и названиям PDF</p>
          <p class="count" id="count" role="status"></p>
          <button id="reset" type="button" hidden>Сбросить поиск и фильтры</button>
          <ul id="documents"></ul>
        </section>
      </div>
    </div>
    <noscript>Для поиска и просмотра списка материалов включите JavaScript.</noscript>
  </main>
</body>
</html>
