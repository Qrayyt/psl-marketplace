<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Справочник PSL — PSL</title>
  <link rel="stylesheet" href="/assets/css/handbook.css?v=3">
  <script defer src="/assets/js/handbook.js?v=4"></script>
</head>
<body>
  <header class="bar">
    <a href="/" aria-label="PSL Marketplace"><img src="/assets/images/psl-logo.svg" width="62" height="28" alt="PSL"></a>
    <a href="/">Каталог PSL ↗</a>
  </header>
  <main>
    <h1>Справочник PSL</h1>
    <p id="status" role="status">Загружаем материалы…</p>
    <div id="archive" hidden>
      <p class="intro">Системы, области применения и материалы для партнёров. Техкарты доступны в карточках <a href="/">каталога</a>.</p>
      <div class="layout">
        <nav aria-label="Разделы справочника">
          <button type="button" data-section="" aria-pressed="true">Все материалы</button>
          <button type="button" data-section="Системы решений" aria-pressed="false">Системы решений</button>
          <button type="button" data-section="Отрасли применения" aria-pressed="false">Отрасли применения</button>
          <button type="button" data-section="Работа с партнёрами" aria-pressed="false">Работа с партнёрами</button>
          <button type="button" data-section="Архив сертификатов" aria-pressed="false">Сертификаты</button>
        </nav>
        <section aria-label="Материалы">
          <label for="search">Поиск по названию</label>
          <input type="search" id="search" placeholder="Например, парковки">
          <p class="count" id="count" role="status"></p>
          <ul id="documents"></ul>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
