# ==============================================================
# WAF: Rate limiting зона для /api/auth/
# Должна быть объявлена ВНЕ блока server {}
# 10 запросов в секунду на один IP, зона 10MB
# ==============================================================
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

# ==============================================================
# WAF: Блокировка подозрительных User-Agent
# sqlmap, nikto, scanner, masscan, nmap и другие инструменты сканирования
# ==============================================================
map $http_user_agent $bad_user_agent {
    default 0;
    ~*sqlmap 1;
    ~*nikto 1;
    ~*scanner 1;
    ~*masscan 1;
    ~*nmap 1;
    ~*dirbuster 1;
    ~*havij 1;
    ~*w3af 1;
    ~*openvas 1;
    ~*nessus 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==============================================================
    # WAF: Ограничение размера тела запроса (защита от перегрузки)
    # 20m для поддержки загрузки файлов каталога от 1С (до 5mb по протоколу)
    # ==============================================================
    client_max_body_size 20m;

    # ==============================================================
    # WAF: Блокировка подозрительных User-Agent
    # Возвращаем 403 если User-Agent совпал с известными сканерами
    # ==============================================================
    if ($bad_user_agent) {
        return 403;
    }

    # ==============================================================
    # WAF: Блокировка SQL-инъекций в URL
    # Проверяем URI на типичные паттерны SQL-инъекций
    # ==============================================================
    set $block_sql_injections 0;
    if ($query_string ~* "union.*select") { set $block_sql_injections 1; }
    if ($query_string ~* "drop\s+table") { set $block_sql_injections 1; }
    if ($query_string ~* "insert\s+into") { set $block_sql_injections 1; }
    if ($query_string ~* "select.*from") { set $block_sql_injections 1; }
    if ($query_string ~* "delete\s+from") { set $block_sql_injections 1; }
    if ($query_string ~* "concat\s*\(") { set $block_sql_injections 1; }
    if ($query_string ~* "information_schema") { set $block_sql_injections 1; }
    if ($query_string ~* "benchmark\s*\(") { set $block_sql_injections 1; }
    if ($query_string ~* "sleep\s*\(") { set $block_sql_injections 1; }
    if ($request_uri ~* "union.*select") { set $block_sql_injections 1; }
    if ($request_uri ~* "drop\s+table") { set $block_sql_injections 1; }
    if ($request_uri ~* "insert\s+into") { set $block_sql_injections 1; }
    if ($request_uri ~* "concat\s*\(") { set $block_sql_injections 1; }
    if ($request_uri ~* "information_schema") { set $block_sql_injections 1; }
    if ($block_sql_injections) {
        return 403;
    }

    # ==============================================================
    # WAF: Блокировка доступа к скрытым файлам
    # .git, .env, .htaccess, .svn и прочие -> 403
    # Исключение: /.well-known/ нужен для ACME-челленджа Let's Encrypt.
    # ==============================================================
    location ~ /\.(?!well-known) {
        deny all;
        return 403;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # ACME-челлендж Let's Encrypt (для certbot webroot).
    # На серверах без HTTPS просто отдаёт 404, не мешает.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ~ ^/admin(?:/(?:overview|orders|materials|users|content|settings))?/?$ {
        try_files /admin/index.html =404;
    }

    location ~ ^/admin/product/?$ {
        try_files /admin/product.html =404;
    }

    # Фронтенд - статические файлы
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==============================================================
    # WAF: Rate limiting для /api/auth/
    # burst=20 -> допускаем всплеск до 20 запросов, nodelay -> без задержки
    # ==============================================================
    location /api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://app:3000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ==============================================================
    # Эндпоинт обмена с 1С — whitelist IP 1С:Fresh
    # 185.98.85.0/24 — реальная подсеть 1cfresh.com (выяснено 30.04.2026)
    # Таймаут увеличен: 1С может слать большие файлы каталога
    # ==============================================================
    location /api/1c/ {
        allow 185.98.85.0/24;
        deny all;

        proxy_pass http://app:3000/api/1c/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # API - проксирование на backend
    location /api/ {
        proxy_pass http://app:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Загруженные файлы
    location /uploads/ {
        proxy_pass http://app:3000/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Кэширование статики
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
