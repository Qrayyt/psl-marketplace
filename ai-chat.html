<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Galenite — AI Chat</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/tablet-style.css">
  <link rel="stylesheet" href="assets/css/mobile-style.css">
</head>
<body>
<div class="site-shell">
  
<header class="topbar">
  <div class="topbar-inner">
    <nav class="nav-left">
      <a class="nav-link " href="index.html">Главная</a>
    </nav>
    <a class="brand" href="index.html">Galenite</a>
    <div class="nav-right">
      <a class="icon-btn" href="profile.html" aria-label="Профиль и корзина">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="count-badge" data-cart-count>0</span>
      </a>
      <a class="icon-btn" href="profile.html" aria-label="Избранное">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12.1 20.3 4.9 13.3a4.8 4.8 0 1 1 6.8-6.8l.3.3.3-.3a4.8 4.8 0 0 1 6.8 6.8l-7 7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="count-badge" data-fav-count>0</span>
      </a>
      <a class="nav-link active" href="ai-chat.html">AI Chat</a>
      <a class="nav-link " href="profile.html">Профиль</a>
    </div>
  </div>
</header>

  <main class="chat-page">
    <div class="container" style="height:100%">
      <section class="chat-shell">
        <aside class="chat-sidebar">
          <h2 class="sidebar-title">Guardex</h2>
          <button class="new-chat" type="button" data-new-chat>+ Новый чат</button>
          <div class="chat-history">
            <button type="button" data-chat-preset="Подбери белые вещи до 10000">Подбери белые вещи до 10000</button>
            <button type="button" data-chat-preset="Собери минималистичный образ">Собери минималистичный образ</button>
            <button type="button" data-chat-preset="Что ты умеешь?">Что ты умеешь?</button>
          </div>
        </aside>
        <div class="chat-main">
          <div class="chat-topbar">
            <button class="chat-menu-btn" type="button" data-chat-menu aria-label="Открыть чаты">
              <span></span><span></span><span></span>
            </button>
            <div class="chat-model">Guardex</div>
          </div>
          <div class="chat-messages" data-chat-messages></div>
          <form class="chat-composer" data-chat-form>
            <div class="chat-box">
              <textarea class="chat-textarea" data-chat-input placeholder="Спроси что угодно" rows="1"></textarea>
              <button class="chat-send" type="submit">↑</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>
  <nav class="mobile-dock"><a class="dock-link " href="index.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Главная</span></a><a class="dock-link " href="index.html#catalog"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Каталог</span></a><a class="dock-link active" href="ai-chat.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M7 17 3 21v-4a7 7 0 1 1 4 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>AI чат</span></a><a class="dock-link " href="profile.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Профиль</span></a></nav>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
