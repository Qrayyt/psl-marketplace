<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Galenite — Profile</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="site-shell">
  
<header class="topbar">
  <div class="topbar-inner">
    <nav class="nav-left">
      <a class="nav-link " href="index.html">Главная</a>
    </nav>
    <a class="brand" href="index.html">Galenite</a>
    <div class="nav-right">
      <a class="icon-btn" href="profile.html" aria-label="Профиль и корзина">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="count-badge" data-cart-count>0</span>
      </a>
      <a class="icon-btn" href="profile.html" aria-label="Избранное">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12.1 20.3 4.9 13.3a4.8 4.8 0 1 1 6.8-6.8l.3.3.3-.3a4.8 4.8 0 0 1 6.8 6.8l-7 7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="count-badge" data-fav-count>0</span>
      </a>
      <a class="nav-link " href="ai-chat.html">AI Chat</a>
      <a class="nav-link active" href="profile.html">Профиль</a>
    </div>
  </div>
</header>

  <main class="section">
    <div class="container profile-layout">
      <aside class="profile-card">
        <h1 class="profile-name">Профиль</h1>
        <p class="profile-sub">Здесь уже лежат корзина, избранное и место под аккаунт — дальше можно спокойно подключать backend.</p>
        <div class="menu-list">
          <button class="menu-btn active" type="button" data-profile-nav="cart">Корзина</button>
          <button class="menu-btn" type="button" data-profile-nav="favs">Избранное</button>
          <button class="menu-btn" type="button" data-profile-nav="account">Аккаунт</button>
        </div>
        <div class="stats-grid">
          <div class="stat"><div class="stat-num" data-stat-cart>0</div><div class="stat-label">в корзине</div></div>
          <div class="stat"><div class="stat-num" data-stat-favs>0</div><div class="stat-label">в избранном</div></div>
          <div class="stat"><div class="stat-num" style="font-size:18px" data-stat-total>0 ₽</div><div class="stat-label">сумма</div></div>
        </div>
      </aside>
      <section data-profile-content></section>
    </div>
  </main>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
